services:
  - type: web
    name: campussphere
    runtime: python
    rootDir: campussphere
    plan: free
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      npm ci --prefix frontend &&
      npm run build --prefix frontend &&
      python backend/manage.py collectstatic --noinput
    startCommand: >-
      cd backend &&
      python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campussphere-db
          property: connectionString

databases:
  - name: campussphere-db
    databaseName: campussphere
    user: campussphere
    plan: free
